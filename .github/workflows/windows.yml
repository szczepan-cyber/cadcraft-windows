name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cargo build --release -p cadcraft *> build.log
          "exit=$LASTEXITCODE" | Add-Content build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Tests of the printing code
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $env:CADCRAFT_NO_SYSTEM_PRINTERS = "1"
          cargo test -p cadcraft-doc -p cadcraft-engine *> test.log
          $env:CADCRAFT_NO_SYSTEM_PRINTERS = ""
          cargo test -p cadcraft-engine windows_lists_and_prints -- --nocapture *>> test.log
          "exit=$LASTEXITCODE" | Add-Content test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/cadcraft.exe dist/
          Copy-Item LICENSE-MIT, LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath CADCraft-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CADCraft-windows
          path: CADCraft-windows.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest CADCraft-windows.zip --title "CADCraft for Windows (with printing)" --notes "Unzip and run cadcraft.exe." --target main
      - name: Save logs to a branch
        if: always()
        shell: pwsh
        run: |
          $tail = { param($f) if (Test-Path $f) { Get-Content $f -Tail 400 } else { "(no $f)" } }
          $dir = Join-Path $env:RUNNER_TEMP "logs"
          New-Item -ItemType Directory -Force $dir | Out-Null
          & $tail "build.log" | Set-Content (Join-Path $dir "build.log")
          & $tail "test.log" | Set-Content (Join-Path $dir "test.log")
          if (Test-Path test.log) { Select-String -Path test.log -Pattern 'printers:|windows_lists|stderr|panicked|FAILED|\.\.\. FAILED|failures' | ForEach-Object { $_.Line } | Set-Content (Join-Path $dir "summary.log") }
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan buildlogs
          git rm -rf . -q
          Copy-Item "$dir\*" .
          git add build.log test.log summary.log
          git commit -q -m "build logs"
          git push -f origin buildlogs
